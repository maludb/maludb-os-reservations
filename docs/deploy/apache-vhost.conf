# ZozoCal — Apache virtual host
# Install: sudo cp docs/deploy/apache-vhost.conf /etc/apache2/sites-available/zozocal.conf
#          edit ServerName / paths, then:
#          sudo a2ensite zozocal && sudo a2dissite 000-default && sudo systemctl reload apache2
#          sudo certbot --apache -d your-domain.example   (adds the :443 vhost and redirect)
#
# Only html/ is web-accessible. config/, helpers/, logs/, scripts/, docs/ stay private.
# No mod_rewrite or .htaccess is needed: the REST API routes via PATH_INFO
# (/api/v1/index.php/reservations/12), which Apache allows for PHP by default.

<VirtualHost *:80>
    ServerName your-domain.example
    # ServerAlias www.your-domain.example

    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Optional: per-server settings as environment variables instead of config/local.php
    # SetEnv APP_URL https://your-domain.example

    ErrorLog ${APACHE_LOG_DIR}/zozocal-error.log
    CustomLog ${APACHE_LOG_DIR}/zozocal-access.log combined
</VirtualHost>
